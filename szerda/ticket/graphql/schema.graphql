"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)



    ticket(
        id: ID! @whereKey
                @rules(
                    apply: ["required", "integer", "min:1"],
                    attribute: "azonosító",
                    messages: [{rule: "min", message: "Csak pozitív számot adhat meg!"}]
                )
    ): Ticket @find


    tickets(
        priority: Priority! @where(operator: "=")
    ): [Ticket]! @all @guard

    statistics: Statistics
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    is_admin: Boolean!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!

    ticket_count: Int! @count(relation: "tickets")

    tickets: [Ticket]! @belongsToMany
    comments: [Comment]! @hasMany
}

type Ticket {
    id: ID!
    title: String!
    priority: Priority! #Int!
    done: Boolean!

    users: [User]! @belongsToMany
    owner: [User]! @belongsToMany

    comments: [Comment]! @hasMany
}

type Comment {
    id: ID!
    description: String!
    filename: String
    filename_hash: String
    ticket_id: Int
    user_id: Int

    ticket: Ticket! @belongsTo
    user: User! @belongsTo
}

enum Priority {
    LOW @enum(value: 0)
    NORMAL @enum(value: 1)
    HIGH @enum(value: 2)
    IMMEDIATE @enum(value: 3)
}

type Statistics {
    active_ticket_number: Int!
    comments_avg: Float!
    most_comments: Ticket!
}
